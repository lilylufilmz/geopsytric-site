<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmed | GeoPSYtric</title>
<meta name="description" content="Get early access to GeoPSYtric, the pattern app made by a tattoo artist. Email only, one confirmation tap.">

<style>
  :root { --bg: #0b0710; --panel: #15101d; --line: #2a2036; --text: #efeaf6; --muted: #a69cb6; --neon: linear-gradient(90deg, #ff2bd6, #8a5cff, #18e0ff); }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { border-bottom: 1px solid var(--line); }
  header .in { max-width: 760px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header img { height: 32px; width: auto; display: block; }
  header a.back { color: var(--muted); text-decoration: none; font-size: 15px; }
  main { max-width: 620px; margin: 0 auto; padding: 40px 20px 64px; }
  .art { width: min(260px, 70vw); aspect-ratio: 1; margin: 0 auto 26px; display: block; }
  h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.12; letter-spacing: -.02em; margin: 0 0 14px; text-align: center; }
  .lead { color: #d9d1e6; text-align: center; margin: 0 0 28px; font-size: 18px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
  label.f { display: block; font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=email] { flex: 1 1 220px; min-width: 0; font: inherit; color: var(--text); background: #0b0710; border: 1px solid #3a2e4a; border-radius: 14px; padding: 14px 16px; }
  input[type=email]:focus { outline: 2px solid #8a5cff; outline-offset: 1px; }
  button { flex: 0 0 auto; font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1; color: #fff; border: 0; border-radius: 14px; padding: 15px 24px; background: var(--neon); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .small { font-size: 13.5px; color: var(--muted); margin: 14px 0 0; }
  .small a, .note a { color: #18e0ff; }
  .msg { display: none; margin: 16px 0 0; padding: 14px 16px; border-radius: 14px; font-size: 15px; }
  .msg.ok { display: block; background: #12261f; border: 1px solid #1f6b4f; color: #c9f5e2; }
  .msg.err { display: block; background: #2a1220; border: 1px solid #7a2a4f; color: #ffd3e6; }
  ul.get { margin: 30px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  ul.get li { padding-left: 30px; position: relative; color: #d9d1e6; }
  ul.get li::before { content: ""; position: absolute; left: 4px; top: .55em; width: 12px; height: 12px; border-radius: 50%; background: var(--neon); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer .in { max-width: 760px; margin: 0 auto; padding: 22px 20px 40px; }
  footer a { color: var(--muted); margin-right: 18px; }
</style>
</head>
<body>
<header><div class="in"><a href="../../"><img src="../../brand/lockup-white.svg" width="1042" height="205" alt="GeoPSYtric"></a><a class="back" href="../../">See the app</a></div></header>
<main>
  <canvas class="art" id="art" width="520" height="520" aria-hidden="true"></canvas>
  <h1>You are on the list</h1>
  
  <p class="lead" style="margin-top:-8px">Thank you, I am glad you are in. You will hear from me when early access opens. Until then, play with the live mandala on the app page.</p>
  <p style="text-align:center;margin:0 0 10px"><a href="../../" style="display:inline-block;padding:15px 26px;border-radius:14px;background:linear-gradient(90deg,#ff2bd6,#8a5cff,#18e0ff);color:#fff;font-weight:600;text-decoration:none">Back to GeoPSYtric</a></p>
  <p class="small" style="text-align:center">Lily</p>

</main>
<footer><div class="in"><a href="../../imprint/">Imprint</a><a href="../../privacy/">Privacy</a><a href="mailto:lily@lily-lu.com">Contact</a></div></footer>
<script>
(() => {
  // a slowly turning mandala, drawn live (no images, nothing loaded from elsewhere)
  const cv = document.getElementById("art"), x = cv.getContext("2d"), S = cv.width, C = S / 2, N = 12;
  const cols = ["#ff2bd6", "#8a5cff", "#18e0ff"];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(t) {
    x.clearRect(0, 0, S, S); x.save(); x.translate(C, C); x.rotate(t * 0.00012);
    x.globalCompositeOperation = "lighter"; x.lineCap = "round";
    for (let k = 0; k < 3; k++) {
      x.strokeStyle = cols[k]; x.lineWidth = 3; x.shadowColor = cols[k]; x.shadowBlur = 12;
      for (let i = 0; i < N; i++) for (const m of [1, -1]) {
        x.save(); x.rotate(i * Math.PI * 2 / N); x.scale(1, m); x.beginPath();
        for (let s = 0; s <= 40; s++) {
          const u = s / 40, r = 40 + u * (190 - k * 30), a = 0.26 * Math.sin(u * Math.PI * (1.5 + k) + t * 0.0006 * (k + 1));
          const px = Math.cos(a) * r, py = Math.sin(a) * r; s ? x.lineTo(px, py) : x.moveTo(px, py);
        }
        x.stroke(); x.restore();
      }
    }
    x.restore();
    if (!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
